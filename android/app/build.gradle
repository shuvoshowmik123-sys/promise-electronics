apply plugin: 'com.android.application'

/**
 * Release signing, read from a file that is not in this repository.
 *
 * The keystore and its password live outside the project and are gitignored.
 * Losing them is not recoverable: Android identifies an app by its signature,
 * so a build signed with a different key cannot install over an existing one
 * and every staff phone would need the app removed and set up again.
 *
 * A missing file is not an error. Debug builds carry on as before, which keeps
 * a fresh clone able to build something without hunting for secrets first.
 */
def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
def hasSigningConfig = false
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
    hasSigningConfig = true
} else {
    def envKeystore = System.getenv("PROMISE_KEYSTORE_PROPERTIES")
    if (envKeystore != null && file(envKeystore).exists()) {
        keystoreProperties.load(new FileInputStream(file(envKeystore)))
        hasSigningConfig = true
    }
}

android {
    namespace = "com.promiseelectronics.staff"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.promiseelectronics.staff"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        /**
         * versionCode is what Android compares; versionName is what people read.
         *
         * The code must go up on every build handed out or the phone treats the
         * new APK as the same app and can refuse to install it over the old one.
         * The name is the number staff will quote back when reporting a problem,
         * so it matches the release tag exactly.
         *
         * 2 / 1.0.1 — notification permission declared and actually requested.
         * 3 / 1.0.2 — location and camera permissions; in-app update prompt.
         */
        versionCode 16
        versionName "1.1.5"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasSigningConfig) {
            release {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            /**
             * Shrink and obfuscate.
             *
             * This app is handed out as a file rather than through Play, so the
             * APK is opened by anyone who receives it. Minifying strips the
             * unused code and renames what is left, which cuts the download and
             * makes the bundle less readable at a glance.
             *
             * shrinkResources needs minifyEnabled and removes drawables and
             * layouts nothing references — most of the saving on a Capacitor
             * app, where the plugins bring resources the shop never uses.
             */
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasSigningConfig) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
