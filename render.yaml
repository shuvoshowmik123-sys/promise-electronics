services:
  - type: web
    name: promise-api
    runtime: node
    region: singapore
    plan: free
    branch: main
    # Order matters: build-server.ts wipes dist/ before writing dist/index.cjs, so
    # the client build must run AFTER it. Vite writes to dist/public, which
    # server/static.ts serves with SPA fallback from this same service — so one
    # Render service now hosts both the API and the frontend on one origin.
    # This removes the dependency on a separate frontend host.
    buildCommand: npm install && npm run build:server && npx vite build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    # ── Only rebuild when something the SERVER cares about changed ────────────
    #
    # Every push to main used to redeploy this service, whatever it touched. That
    # is not merely wasted build minutes: a deploy restarts the Node process,
    # which drops every open SSE connection and every in-flight session. A CSS
    # tweak on the customer site was interrupting the admin panel's live updates.
    #
    # Deliberately expressed as ignoredPaths rather than paths. With an allow
    # list, any directory nobody remembered to add would silently stop
    # deploying — the worst failure here, because the symptom is "my fix didn't
    # work" long after the cause. With a deny list, anything unrecognised still
    # deploys: noisier, but never silently stale.
    #
    # `shared/` is deliberately absent from this list: it is imported by both
    # sides, so a change there must rebuild the server as well as the frontend.
    #
    # client/ is ignored because Vercel serves the frontend in production. This
    # service still BUILDS the client (see buildCommand) so it can serve the app
    # standalone as a fallback, but that copy only needs refreshing when the
    # server itself redeploys.
    buildFilter:
      ignoredPaths:
        - client/**
        - docs/**
        - tests/**
        - e2e/**
        - mockups/**
        - mobile-qa/**
        - mobile_app_flutter/**
        - playwright-report/**
        - test-results/**
        - qa-tooling/**
        - qa-tmp-reminders-reconciliation/**
        - skills/**
        - resources/**
        - assets/**
        - db-baselines/**
        - "*.md"
        - "*.png"
        - "*.log"
    envVars:
      - key: NODE_ENV
        value: production
      # Vite inlines VITE_* at BUILD time. Without these the client bundle ships
      # apiKey: undefined, and Firebase Auth throws auth/invalid-api-key.
      # Set the values in the Render dashboard, then redeploy so the client is
      # rebuilt with them. Google Sign-In degrades gracefully if left unset.
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: VITE_FIREBASE_PROJECT_ID
        sync: false
      - key: VITE_FIREBASE_STORAGE_BUCKET
        sync: false
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: VITE_FIREBASE_APP_ID
        sync: false
      # Web Push certificate public key (Firebase Console > Project settings >
      # Cloud Messaging > Web configuration). Vite inlines this at BUILD time, so
      # it must be set before the deploy or the bundle ships with push disabled.
      - key: VITE_FIREBASE_VAPID_KEY
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: BRAIN_DATABASE_URL
        sync: false
      - key: PGDATABASE
        sync: false
      - key: PGHOST
        sync: false
      - key: PGPORT
        sync: false
      - key: PGUSER
        sync: false
      - key: PGPASSWORD
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REFRESH_TOKEN
        sync: false
      - key: GOOGLE_DRIVE_BACKUP_FOLDER_ID
        sync: false
      - key: BACKUP_ENCRYPTION_PASSWORD
        sync: false
      - key: IMAGEKIT_PUBLIC_KEY
        sync: false
      - key: IMAGEKIT_PRIVATE_KEY
        sync: false
      - key: IMAGEKIT_URL_ENDPOINT
        sync: false
      - key: SMS_API_URL
        sync: false
      - key: SMS_API_KEY
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_ENDPOINT
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: MESSENGER_PAGE_ACCESS_TOKEN
        sync: false
      - key: MESSENGER_VERIFY_TOKEN
        sync: false
      - key: FACEBOOK_PAGE_ID
        sync: false
      - key: FRONTEND_URL
        sync: false
